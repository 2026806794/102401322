[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: 需要较长运行时间的测试

# 覆盖率用 pytest-cov 插件看：
#     python -m pytest --cov=src --cov-branch --cov-report=html:output/htmlcov
# --cov-branch 是看分支覆盖率（每个 if / for 的两个方向有没有都测到），
# 只看语句覆盖率的话，那种"写了 if 但只测了一个分支"的情况发现不了。
