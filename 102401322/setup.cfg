# flake8 代码质量检查的配置
# 用法：python -m flake8

[flake8]
# 一行最多 100 个字符。PEP8 默认是 79，但中文注释多的时候 79 太挤了，
# 100 是很多项目实际用的值。
max-line-length = 100

# 这些目录不用检查
exclude =
    .git,
    __pycache__,
    output,
    data,
    logs,
    .vscode

# scripts 下面的脚本要先把项目根目录加到 sys.path 才能 import src 里的模块，
# 所以 import 语句没法全放在文件开头，这里放行 E402。
per-file-ignores =
    scripts/*.py: E402

# 统计信息，方便看还剩多少问题
statistics = True
